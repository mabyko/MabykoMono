name: Bump Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0)"
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mabyko/homebrew-tap
          token: ${{ secrets.MABYKO_TAP_GITHUB_TOKEN }}

      - name: Update casks
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/mabyko/MabykoMono/releases/download/${TAG}"
          bump() {  # bump <cask-file> <zip-name>
            sha=$(curl -sfL "${BASE}/$2" | shasum -a 256 | cut -d' ' -f1)
            sed -i -E \
              -e "s/version \"[^\"]+\"/version \"${VERSION}\"/" \
              -e "s/sha256 \"[^\"]+\"/sha256 \"${sha}\"/" \
              "Casks/$1"
          }
          bump font-mabyko-mono.rb    "MabykoMono-${TAG}.zip"
          bump font-mabyko-mono-nf.rb "MabykoMono_NF_${TAG}.zip"
          bump font-mabyko-mono-nl.rb "MabykoMono_NL_${TAG}.zip"
          git --no-pager diff

      - name: Commit and push
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "casks already at ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "bump Mabyko Mono casks to ${TAG}"
          git push

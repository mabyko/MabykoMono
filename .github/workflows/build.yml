name: Build and verify fonts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test all variants
        run: docker compose run --rm build
      - name: Check reproducibility
        run: |
          find out/fonts out/release -type f \( -name '*.ttf' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > /tmp/font-checksums
          docker compose run --rm build
          sha256sum --check /tmp/font-checksums

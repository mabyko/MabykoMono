name: mabyko-mono

services:
  shell:
    image: mabyko/mabyko-mono-build:1.1.0
    pull_policy: build
    build: .
    working_dir: /work
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
    volumes:
      - .:/work
      - docker-venv:/venv
      - uv-cache:/root/.cache/uv
    command: bash

  build:
    image: mabyko/mabyko-mono-build:1.1.0
    pull_policy: build
    build: .
    working_dir: /work
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
    volumes:
      - .:/work
      - docker-venv:/venv
      - uv-cache:/root/.cache/uv
    command: >
      bash -lc "uv sync --locked &&
      uv run --locked python scripts/test_build.py &&
      uv run --locked python scripts/fetch.py &&
      rm -rf build out/fonts &&
      fontforge -script scripts/build_regular.py &&
      uv run --locked python scripts/fix_tables.py &&
      uv run --locked python scripts/test_font.py &&
      uv run --locked python scripts/package_release.py &&
      uv run --locked python scripts/test_outputs.py"

  test:
    image: mabyko/mabyko-mono-build:1.1.0
    pull_policy: build
    build: .
    working_dir: /work
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
    volumes:
      - .:/work
      - docker-venv:/venv
      - uv-cache:/root/.cache/uv
    command: >
      bash -lc "uv run --locked python scripts/test_font.py &&
      uv run --locked python scripts/package_release.py &&
      uv run --locked python scripts/test_outputs.py"

volumes:
  docker-venv:
  uv-cache:
